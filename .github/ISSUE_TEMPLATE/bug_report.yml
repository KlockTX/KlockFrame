name: 缺陷报告
description: 报告一个可复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先跑一遍 `php tests/unit.php` 与 `php tests/http.php`，
        并在标题里点明受影响的模块（router / view / response / request / util / config）。
  - type: input
    id: version
    attributes:
      label: 框架版本
      description: 输出 `echo KF_VERSION;` 的值
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP 版本与 SAPI
      description: "`php -v` 第一行；顺带说明是 CLI、php -S、Apache 还是 Nginx + FPM"
      placeholder: "PHP 8.4.24 (cli) / Nginx + PHP-FPM"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 最小复现
      description: 越短越好。能贴一段路由 + 视图就贴，不要贴整个站点
      render: php
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有响应头/HTML 片段请原样贴出（注意先抹掉 cookie 与 token）
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: "`kf_log` 写下的内容或服务器错误日志；请确认不含凭据与绝对路径泄露"
      render: text
